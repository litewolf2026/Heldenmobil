name: Apply HeldenMobil v16

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v16:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run HeldenMobil v16 migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v16 migration
        run: python tools/apply_v16.py

      - name: Commit updated app
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "HeldenMobil v16: rules, inventory and collapsible sections"
          git push
