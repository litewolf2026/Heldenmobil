name: Apply HeldenMobil v17.1.1 alignment

on:
  push:
    paths:
      - '.github/workflows/apply-v17-1-1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply alignment patch
        run: python tools/apply_v17_1_1.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S)
          Path('/tmp/heldenmobil.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/heldenmobil.js
      - name: Verify patch
        run: |
          grep -q 'v17.1.1 Spieltisch alignment' index.html
          grep -q 'translateY(1.35cqw)' index.html
          grep -q 'data-zone="bauch"' index.html
          grep -q 'data-zone="rechterarm"' index.html
      - name: Commit release and clean helper
        run: |
          rm tools/apply_v17_1_1.py
          rm .github/workflows/apply-v17-1-1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v17.1.1: align Spieltisch overlays'
          git push
