name: Apply HeldenMobil v17.1 layout polish

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-v17-1:
    if: ${{ github.event.head_commit.message == 'Run HeldenMobil v17.1 layout polish' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v17.1 migration
        run: python tools/apply_v17_1.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',source,re.S|re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          Path('/tmp/heldenmobil-v17-1.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/heldenmobil-v17-1.js
      - name: Verify layout contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for token in ['HeldenMobil – HLD PoC v17.1','dashboard-energy-empty','dashboard-footer-item','top:43.9%','left:75.1%']:
              if token not in s:
                  raise SystemExit(f'Missing {token}')
          PY
      - name: Commit v17.1 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v17-1-layout.yml tools/apply_v17_1.py .v17-1-trigger
          git add index.html
          git commit -m "v17.1: polish Spieltisch layout"
          git push
