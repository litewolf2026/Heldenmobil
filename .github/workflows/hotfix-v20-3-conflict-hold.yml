name: Hotfix HeldenMobil v20.3 conflict hold

on:
  push:
    paths:
      - '.github/workflows/hotfix-v20-3-conflict-hold.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply conflict guard
        run: python3 tools/hotfix_v20_3_conflict_hold.py
      - name: Verify JavaScript syntax
        run: |
          node --check js/hld-parser.js
          node --check js/companion-core.js
          node --check js/combat-core.js
          node --check js/app.js
      - name: Run regression suite
        run: npm test
      - name: Verify conflict hold
        run: grep -F 'cloudState.conflictHeroKey===key&&!force' js/app.js
      - name: Commit final v20.3 and clean tooling
        run: |
          git config user.name 'HeldenMobil Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm tools/hotfix_v20_3_conflict_hold.py .github/workflows/hotfix-v20-3-conflict-hold.yml
          git add js/app.js tests/smoke.mjs
          git commit -m 'v20.3: hold autosync while cloud conflict is unresolved [skip ci]'
          git push
