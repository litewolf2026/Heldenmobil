name: Migrate HeldenMobil v20.1-v20.3

on:
  push:
    paths:
      - '.github/workflows/migrate-v20-stabilization.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply stabilization migration
        run: python3 tools/migrate_v20_1_to_20_3.py

      - name: Verify JavaScript syntax
        run: |
          node --check js/hld-parser.js
          node --check js/companion-core.js
          node --check js/combat-core.js
          node --check js/app.js
          node --check vendor/jszip-3.10.1.min.js

      - name: Run regression suite
        run: npm test

      - name: Verify release contract
        run: |
          grep -F 'Beta v20.3' index.html
          grep -F 'Begleitdaten v20.3' index.html
          grep -F 'HeldenMobil Beta v20.3' index.html
          grep -F '<script src="js/hld-parser.js"></script>' index.html
          grep -F '<script src="js/companion-core.js"></script>' index.html
          grep -F '<script src="js/combat-core.js"></script>' index.html
          grep -F "lastQualityAudit={version:'20.3'" js/app.js
          test -f CHANGELOG.md

      - name: Commit v20.3 and remove migration tooling
        run: |
          git config user.name 'HeldenMobil Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm tools/migrate_v20_1_to_20_3.py .github/workflows/migrate-v20-stabilization.yml
          git add -A
          git commit -m 'v20.3: complete stabilization and regression pass [skip ci]'
          git push
