name: Apply HeldenMobil v17.2.1 compact events

on:
  push:
    paths:
      - '.github/workflows/patch-v17-2-1-events.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index.html
        run: python .github/scripts/patch_v17_2_1_events.py
      - name: JavaScript syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          inline=[b for b in blocks if b.strip()]
          if not inline:
              raise SystemExit('no inline script found')
          Path('/tmp/heldenmobil.js').write_text('\n'.join(inline),encoding='utf-8')
          PY
          node --check /tmp/heldenmobil.js
      - name: Verify compact event contract
        shell: bash
        run: |
          grep -q 'ENERGY_EVENT_WINDOW_MS=25000' index.html
          grep -q 'events.slice(0,10)' index.html
          grep -q 'function normalizeAdventureEvents(events)' index.html
          grep -q 'function logEnergyEvent(label,before,after)' index.html
      - name: Commit patch and clean one-shot tooling
        shell: bash
        run: |
          git config user.name 'HeldenMobil Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-v17-2-1-events.yml .github/scripts/patch_v17_2_1_events.py
          git add index.html
          git commit -m 'v17.2.1: compact adventure energy events [skip ci]'
          git push origin HEAD:main
