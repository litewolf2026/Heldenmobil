name: Apply HeldenMobil v17.2 patch

on:
  push:
    paths:
      - '.github/workflows/patch-v17-2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate index.html
        shell: bash
        run: |
          python -c "import base64; exec(base64.b64decode('...8756 chars truncated...')" 
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'HeldenMobil Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-v17-2.yml
          git add index.html
          git commit -m 'v17.2: favorite spells and collapsible spell list [skip ci]'
          git push origin HEAD:main
