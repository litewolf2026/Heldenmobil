name: Apply HeldenMobil v17.2 patch

on:
  push:
    paths:
      - '.github/workflows/patch-v17-2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index.html
        run: python .github/scripts/patch_v17_2.py
      - name: JavaScript syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          inline=[b for b in blocks if b.strip()]
          if not inline:
              raise SystemExit('no inline script found')
          Path('/tmp/heldenmobil.js').write_text('\n'.join(inline),encoding='utf-8')
          PY
          node --check /tmp/heldenmobil.js
      - name: Commit patch and clean one-shot tooling
        shell: bash
        run: |
          git config user.name 'HeldenMobil Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-v17-2.yml .github/scripts/patch_v17_2.py
          git add index.html
          git commit -m 'v17.2: favorite spells and collapsible spell list [skip ci]'
          git push origin HEAD:main
