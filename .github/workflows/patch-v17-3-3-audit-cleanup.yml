name: Apply HeldenMobil v17.3.3 audit cleanup

on:
  push:
    paths:
      - '.github/workflows/patch-v17-3-3-audit-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and JavaScript syntax check
        run: |
          python3 tools/apply_v17_3_3.py
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          for(const s of scripts) new Function(s);
          console.log(`checked ${scripts.length} inline scripts`);
          NODE
      - name: Verify audit cleanup contract
        run: |
          grep -q "HLD PoC v17.3.3" index.html
          grep -q "'Magierstab (kurz)'" index.html
          grep -q "function spellLegacyFavoriteKey" index.html
          grep -q "spellFavoriteKey(z,idx)" index.html
          grep -q "SPELL_DUPLICATE.*info\|info.*SPELL_DUPLICATE" index.html
      - name: Commit patch and clean one-shot tooling
        run: |
          git config user.name "HeldenMobil Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm tools/apply_v17_3_3.py .github/workflows/patch-v17-3-3-audit-cleanup.yml
          git add index.html
          git commit -m "v17.3.3: close HLD audit findings [skip ci]"
          git push
