name: Apply HeldenMobil v18.0 magical items
on:
  push:
    paths:
      - 'tools/apply_v18_0_magic_items.py'
      - '.github/workflows/patch-v18-0-magic-items.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/apply_v18_0_magic_items.py
      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S|re.I)
          if not scripts:
              raise SystemExit('no script found')
          Path('/tmp/heldenmobil.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/heldenmobil.js
      - name: Verify v18 contract
        run: |
          grep -q 'HLD PoC v18.0' index.html
          grep -q 'const COMP_SCHEMA=7' index.html
          grep -q 'Magische Gegenstände' index.html
          grep -q 'function addArtifactEffect' index.html
          grep -q 'function triggerArtifactEffect' index.html
          grep -q 'dashboard-artifact-trigger' index.html
          grep -q "for(const v of \[6,5,4,3,2,1\])" index.html
      - name: Commit release and clean one-shot tooling
        run: |
          git config user.name 'HeldenMobil Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm tools/apply_v18_0_magic_items.py .github/workflows/patch-v18-0-magic-items.yml
          git add index.html
          git commit -m 'v18.0: add inventory-linked magical items [skip ci]'
          git push
