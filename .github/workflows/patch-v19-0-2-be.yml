name: Apply HeldenMobil v19.0.2 BE semantics

on:
  push:
    paths:
      - '.github/workflows/patch-v19-0-2-be.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v19.0.2 patch
        run: python3 tools/patch_v19_0_2_be.py

      - name: Verify JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.rindex('<script>')+len('<script>')
          end=s.rindex('</script>')
          Path('/tmp/heldenmobil.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/heldenmobil.js

      - name: Verify BE contract
        run: |
          grep -F 'Beta v19.0.2' index.html
          grep -F 'function dashboardEffectiveBE(set,armor)' index.html
          grep -F "const wd=woundData(),gbe=armor.be" index.html
          grep -F "l:'gBE',v:armor.be" index.html
          grep -F 'eff. BE Hauptwaffe' index.html
          ! grep -F '19.0.1' index.html
          ! grep -F 'gbe=armor.baseBE,eff=armor.be' index.html

      - name: Commit release and remove one-shot tooling
        run: |
          git config user.name 'HeldenMobil Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm tools/patch_v19_0_2_be.py .github/workflows/patch-v19-0-2-be.yml
          git add index.html
          git commit -m 'v19.0.2: correct gBE and effective BE semantics [skip ci]'
          git push
