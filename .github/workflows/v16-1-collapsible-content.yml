name: Apply HeldenMobil v16.1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-v16-1:
    if: ${{ github.event.head_commit.message == 'Run HeldenMobil v16.1 migration' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: python tools/apply_v16_1.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',source,re.S|re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          Path('/tmp/heldenmobil-v16-1.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/heldenmobil-v16-1.js
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v16-1-collapsible-content.yml tools/apply_v16_1.py
          git add index.html
          git commit -m "v16.1: collapsible content cards"
          git push
