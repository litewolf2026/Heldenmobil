name: Fix v16 parameterized disadvantages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Fix v16 parameterized disadvantages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch HLD disadvantage parser
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = """    const vtEntries=vorteile.map(v=>{\n      const name=attr(v,'name'),val=cleanName(attr(v,'value'));\n      const details=[...directSelections(v).map(cleanName),val].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i);\n      if(/^Vorurteile(?: gegen)?$/i.test(name)&&details.length){\n        const numbers=details.filter(x=>/^[-+]?\\d+(?:[.,]\\d+)?$/.test(x)),targets=details.filter(x=>!/^[-+]?\\d+(?:[.,]\\d+)?$/.test(x));\n        return {name,label:`${name==='Vorurteile'?'Vorurteile gegen':name}${targets.length?` ${targets.join(' / ')}`:''}${numbers.length?` ${numbers.join(' / ')}`:''}`};\n      }\n      return {name,label:name+(details.length?`: ${details.join(' · ')}`:'')};\n    });\n"""

          new = """    const vtEntries=vorteile.map(v=>{\n      const name=attr(v,'name'),val=cleanName(attr(v,'value'));\n      const choices=directAll(v,'auswahl').map((a,i)=>({position:num(attr(a,'position'),i),value:cleanName(attr(a,'value'))})).filter(x=>x.value).sort((a,b)=>a.position-b.position).map(x=>x.value);\n      const details=[...choices,...directSelections(v).map(cleanName),val].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i);\n      const level=choices.find(x=>/^[-+]?\\d+(?:[.,]\\d+)?$/.test(x));\n      const targets=choices.filter(x=>x!==level);\n      if(level&&targets.length&&(/^(?:Vorurteile gegen|Weltfremd bzgl\\.|Angst vor)/i.test(name))){\n        return {name,label:`${name} ${targets.join(' / ')}: ${level}`};\n      }\n      return {name,label:name+(details.length?`: ${details.join(' · ')}`:'')};\n    });\n"""

          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected parser block once, found {count}')
          s = s.replace(old, new)

          # Guard the exact Kallim HLD shape we inspected: position 0 is level, position 1 target.
          sample = [('0','6'),('1','Elfen')]
          ordered = [v for _,v in sorted(sample, key=lambda x:int(x[0]))]
          level = next((x for x in ordered if x.isdigit()), None)
          targets = [x for x in ordered if x != level]
          assert f"Vorurteile gegen {' / '.join(targets)}: {level}" == 'Vorurteile gegen Elfen: 6'

          p.write_text(s, encoding='utf-8')
          PY

      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/heldenmobil-main.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/heldenmobil-main.js

      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v16-fix-parameterized-disadvantages.yml
          git add index.html
          git commit -m "v16: parse parameterized disadvantages correctly"
          git push
