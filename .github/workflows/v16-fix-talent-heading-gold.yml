name: Fix v16 talent heading color

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Fix v16 talent heading color'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore gold talent group headings
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.group-toggle .group-count{color:#8e99a8;font-weight:600;margin-left:2px}'
          new='.group-toggle .group-label{color:var(--accent2)}.group-toggle .group-count{color:#8e99a8;font-weight:600;margin-left:2px}'
          if old not in s:
              raise SystemExit('Expected v16 group-count CSS not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v16-fix-talent-heading-gold.yml
          git add index.html
          git commit -m "v16: restore gold talent group headings"
          git push
