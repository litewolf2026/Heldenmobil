name: Complete HeldenMobil v16 talent aliases

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  complete-v16-talents:
    if: github.event.head_commit.message == 'Complete HeldenMobil v16 talent aliases'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add remaining combat talent aliases
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="['Kampf', new Set([...Object.keys(COMBAT_META),'Blasrohr','Kettenstäbe','Peitsche','Zweihandflegel'])]"
          new="['Kampf', new Set([...Object.keys(COMBAT_META),'Bastardstäbe','Blasrohr','Kettenstäbe','Peitsche','Stangenwaffen','Zweihandflegel'])]"
          if old not in s:
              raise SystemExit('Expected v16 combat talent list not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/heldenmobil.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/heldenmobil.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "v16: complete combat talent aliases"
          git push
